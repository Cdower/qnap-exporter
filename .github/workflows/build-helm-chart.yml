name: .Build Helm chart

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
        description: Chart version to release
      context-path:
        required: true
        type: string
        description: Path to Chart in Git repository
      helm-registry:
        required: true
        type: string
        description: Helm remote repository name
      helm-registry-directory:
        required: true
        type: string
        description:  Helm remote repository directory

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      # pushes the Chart.yaml version bump back to the repository
      contents: write
      # push the chart to ghcr.io with GITHUB_TOKEN
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # https://github.blog/2022-04-12-git-security-vulnerability-announced/
      - name: Set git settings and fix repository ownership
        run: |
          # this is to fix GIT not liking owner of the checkout dir
          chown -R "$(id -u):$(id -g)" "$PWD"
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git config --global --add --bool push.autoSetupRemote true

      - name: Set variables
        id: vars
        shell: bash
        working-directory: ${{ inputs.context-path }}
        run: |
          echo "chart-name=$(yq -r '.name' Chart.yaml)" >> "$GITHUB_OUTPUT"

      - name: Update Chart version
        shell: bash
        working-directory: ${{ inputs.context-path }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          yq e -i '.appVersion = "v" + strenv(VERSION)' Chart.yaml
          yq e -i '.version = strenv(VERSION)' Chart.yaml

      - name: Login to Docker Registry
        id: docker-login
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy chart
        shell: bash
        working-directory: ${{ inputs.context-path }}
        env:
          CHART_NAME: ${{ steps.vars.outputs.chart-name }}
          VERSION: ${{ inputs.version }}
          HELM_REGISTRY: ${{ inputs.helm-registry }}
          HELM_REGISTRY_DIRECTORY: ${{ inputs.helm-registry-directory }}
        run: |
          helm package .
          helm push "${CHART_NAME}-${VERSION}.tgz" "${HELM_REGISTRY}/${HELM_REGISTRY_DIRECTORY}"

      - name: Commit and push
        shell: bash
        working-directory: ${{ inputs.context-path }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git add Chart.yaml
          git commit -a -m "Helm chart version bumped to ${VERSION}"
          git push

      - name: Summary Helm release
        env:
          CHART_NAME: ${{ steps.vars.outputs.chart-name }}
          VERSION: ${{ inputs.version }}
          HELM_REGISTRY: ${{ inputs.helm-registry }}
          HELM_REGISTRY_DIRECTORY: ${{ inputs.helm-registry-directory }}
        run: |
          {
            echo "### Helm Chart :white_check_mark:"
            echo "| <!-- -->    | <!-- -->    |"
            echo "|-------------|-------------|"
            echo "|Name    |${CHART_NAME}|"
            echo "|Version |${VERSION}|"
            echo "|URL     |${HELM_REGISTRY}/${HELM_REGISTRY_DIRECTORY}/${CHART_NAME}/${CHART_NAME}-${VERSION}.tgz|"
          } >> "$GITHUB_STEP_SUMMARY"