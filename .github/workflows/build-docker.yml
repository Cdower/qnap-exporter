name: .Docker builder

on:
  workflow_call:
    inputs:
      docker-image-name:
        required: true
        type: string
        description: Name of Container image
      docker-registry:
        required: true
        type: string
        description: Docker registry name
      docker-repository:
        required: true
        type: string
        description: Docker repository directory name
      version:
        required: true
        type: string
        description: Container image version
      context-path:
        required: false
        type: string
        default: .
        description: Context path

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          install: true
     
      - name: Login to Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ inputs.docker-registry }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Get build date
        id: date
        run: echo "date=$(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context-path }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ inputs.docker-registry }}/${{ inputs.docker-repository }}/${{ inputs.docker-image-name }}:${{ inputs.version }},${{ inputs.docker-registry }}/${{ inputs.docker-repository }}/${{ inputs.docker-image-name }}:latest
          build-args: |
            "APP_NAME=${{ inputs.docker-image-name }}"
            "VERSION=${{ inputs.version }}"
            "BUILD_DATE=${{ steps.date.outputs.date }}"
            "REVISION=${{ github.sha }}"
            "REF=${{ github.ref }}"