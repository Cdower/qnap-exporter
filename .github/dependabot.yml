version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"

  # Images used only by the end-to-end test (tests/e2e).
  - package-ecosystem: "docker"
    directory: "/tests/e2e/snmpsim"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker-compose"
    directory: "/tests/e2e"
    schedule:
      interval: "weekly"
