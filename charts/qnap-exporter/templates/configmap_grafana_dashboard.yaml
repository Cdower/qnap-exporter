{{- if .Values.dashboard.enabled }}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ base $path | replace (ext $path) "" }}
  namespace: {{ $.Values.dashboard.namespace | default $.Release.Namespace | quote }}
  labels:
    {{- include "qnap-exporter.labels" $ | nindent 4 }}
    {{- with $.Values.dashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
