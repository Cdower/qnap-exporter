apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qnap-exporter.fullname" . }}
  labels:
    {{- include "qnap-exporter.labels" . | nindent 4 }}
spec:
  # More than one replica would remote-write duplicate samples.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "qnap-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "qnap-exporter.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "qnap-exporter.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
            - --server.http.listen-addr=0.0.0.0:{{ .Values.service.port }}
          env:
            - name: QNAP_SNMP_ADDRESS
              value: {{ required "nas.snmp.address is required" .Values.nas.snmp.address | quote }}
            - name: QNAP_HOSTNAME
              value: {{ .Values.nas.hostname | quote }}
            - name: SCRAPE_INTERVAL
              value: {{ .Values.nas.scrapeInterval | quote }}
            - name: SCRAPE_TIMEOUT
              value: {{ .Values.nas.scrapeTimeout | quote }}
            - name: SNMP_TIMEOUT
              value: {{ .Values.nas.snmp.timeout | quote }}
            - name: SNMP_RETRIES
              value: {{ .Values.nas.snmp.retries | quote }}
            - name: GRAFANA_CLOUD_PROMETHEUS_URL
              value: {{ required "grafanaCloud.prometheusUrl is required" .Values.grafanaCloud.prometheusUrl | quote }}
            - name: GRAFANA_CLOUD_PROMETHEUS_USERNAME
              value: {{ required "grafanaCloud.username is required" .Values.grafanaCloud.username | quote }}
            - name: GRAFANA_CLOUD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "qnap-exporter.secretName" . }}
                  key: GRAFANA_CLOUD_API_KEY
            - name: QNAP_SNMP_COMMUNITY
              valueFrom:
                secretKeyRef:
                  name: {{ include "qnap-exporter.secretName" . }}
                  key: QNAP_SNMP_COMMUNITY
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # /-/healthy fails whenever any component is unhealthy, which a
          # restart wouldn't fix; only restart if the server stops responding.
          livenessProbe:
            tcpSocket:
              port: http
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/alloy/data
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        # Remote-write WAL; doesn't need to survive restarts.
        - name: data
          emptyDir: {}
