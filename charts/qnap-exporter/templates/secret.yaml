{{- if not .Values.grafanaCloud.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qnap-exporter.fullname" . }}
  labels:
    {{- include "qnap-exporter.labels" . | nindent 4 }}
type: Opaque
stringData:
  GRAFANA_CLOUD_API_KEY: {{ .Values.grafanaCloud.apiKey | quote }}
  QNAP_SNMP_COMMUNITY: {{ .Values.nas.snmp.community | quote }}
{{- end }}
