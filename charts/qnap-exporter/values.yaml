# Default values for qnap-exporter

image:
  repository: ghcr.io/bsosnowski/docker/qnap-exporter
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag:

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Alloy UI and health endpoints.
service:
  type: ClusterIP
  port: 12345

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
#  limits:
#    cpu: 500m
#    memory: 256Mi
#  requests:
#    cpu: 200m
#    memory: 256Mi

nodeSelector: {}

tolerations: []

affinity: {}

nas:
  # Value of the "instance" label on every metric.
  hostname: NAS453D
  snmp:
    # host[:port] of the NAS SNMP agent (SNMP v2c).
    address: "192.168.1.100:161"
    # Ignored when grafanaCloud.existingSecret is set.
    community: "snmp-telegraf"
  # How often to poll the NAS, and how long a full SNMP walk may take.
  scrapeInterval: 60s
  scrapeTimeout: 50s

grafanaCloud:
  # Prometheus remote_write endpoint, e.g.
  # https://prometheus-prod-XX-prod-REGION.grafana.net/api/prom/push
  prometheusUrl: ""
  # Grafana Cloud Prometheus instance ID.
  username: ""
  # Access policy token with the metrics:write scope.
  # Ignored when existingSecret is set.
  apiKey: ""
  # Name of an existing Secret holding the GRAFANA_CLOUD_API_KEY and
  # QNAP_SNMP_COMMUNITY keys. When empty, the chart creates one from
  # grafanaCloud.apiKey and nas.snmp.community.
  existingSecret: ""

# Extra environment variables for the Alloy container.
extraEnv: []

# Grafana dashboard ConfigMap, for Grafana instances that load dashboards
# through the sidecar. On Grafana Cloud, import dashboards/qnap-dashboard.json
# instead.
dashboard:
  enabled: false
  # Defaults to the release namespace.
  namespace: ""
  labels:
    grafana_dashboard: "1"
